name: Build FushDNS ESP32-C3

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Find firmware source
        run: |
          find . -type f
          SKETCH=$(find . -type f -name "*.ino" -print -quit)

          if [ -z "$SKETCH" ]; then
            echo "ERROR: No Arduino sketch found!"
            exit 1
          fi

          echo "Found sketch: $SKETCH"
          mkdir -p /tmp/FushDNS
          cp -r "$(dirname "$SKETCH")/." /tmp/FushDNS/
          cp "$SKETCH" /tmp/FushDNS/FushDNS.ino

          ORIGINAL=$(basename "$SKETCH")
          if [ "$ORIGINAL" != "FushDNS.ino" ]; then
            rm "/tmp/FushDNS/$ORIGINAL"
          fi

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc \
            --output-dir build \
            /tmp/FushDNS

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: FushDNS-ESP32-C3
          path: build/*.bin
